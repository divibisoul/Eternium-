name: SOUL 25 Capability Upgrade - N02

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate 25-repository augmentation contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('integrations/soul-25-augmentation.json'))
          assert d['external_provider_count'] == 25
          assert len(d['external_providers']) == 25
          assert d['soul_peer_count'] == 9
          assert len(d['soul_peers']) == 9
          assert d['native_authority'] == 'preserved'
          for p in d['external_providers']:
              assert p['id'] and p['capabilities']
              assert p['structural_state'] == 'REAL'
              assert p['requires_adapter'] is True
          print('SOUL-34 / 25-UPSTREAM AUGMENTATION CONTRACT: PASS')
          PY
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: N02 25-source fabric tests
        run: npx --yes tsx --test src/soul-mesh/N02ExternalCapabilityFabric.test.ts
      - name: N02 external inference adapter tests
        run: npx --yes tsx --test src/soul-mesh/N02ExternalInferenceBridge.test.ts
      - name: N02 typecheck
        run: npx tsc -p tsconfig.json --noEmit
