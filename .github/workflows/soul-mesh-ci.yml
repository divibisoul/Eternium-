name: Soul Mesh CI
on:
  push:
    branches: [ main, 'upgrade/**' ]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Typecheck complete Mesh/runtime surface
        run: npx tsc -p tsconfig.mesh.json --noEmit
      - name: Build web runtime
        run: npm run build
