name: Soul Mesh CI
on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'upgrade/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Validate Mesh compatibility adapter
        run: npm run test:mesh-compatibility
      - name: Typecheck Mesh adapter
        run: npx tsc -p tsconfig.mesh.json --noEmit
      - name: Build web runtime
        run: npm run build
