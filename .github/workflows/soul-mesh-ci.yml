name: Soul Mesh CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck Mesh adapter
        run: npx tsc -p tsconfig.mesh.json --noEmit
      - name: Gemini reliability tests
        run: node --experimental-transform-types services/geminiReliability.test.ts
      - name: N02 capability execution regressions
        run: |
          node --experimental-transform-types src/soul-mesh/N02FunctionalCapabilities.test.ts
          node --experimental-transform-types src/soul-mesh/N02TransportIntegrity.test.ts
      - name: N02 restored boundary regressions
        run: node --experimental-transform-types api/n02-reintegration.test.ts
      - name: Build web runtime
        run: npm run build
