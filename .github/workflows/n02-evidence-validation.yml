name: N02 Evidence Validation

on:
  push:
    branches:
      - main
      - feat/aeternum-8-modules-2026-09-23
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies without mutating lock state
        run: npm install --no-audit --no-fund --package-lock=false

      - name: TypeScript validation
        run: npm run lint

      - name: Evidence boundary
        run: npm run audit:evidence

      - name: Production build
        run: npm run build
