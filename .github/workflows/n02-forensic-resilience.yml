name: N02 Forensic Resilience

on:
  push:
    branches: [forensic/n02-resilience-generative-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnostics, build and chaos
        shell: bash
        run: |
          set +e
          status=0
          {
            echo '=== node ==='; node --version; npm --version
            echo '=== npm install ==='; npm install --no-audit --no-fund; rc=$?; echo "install_exit=$rc"; ((rc != 0)) && status=1
            echo '=== root typecheck ==='; npm run lint; rc=$?; echo "lint_exit=$rc"; ((rc != 0)) && status=1
            echo '=== N02 strict typecheck ==='; npm run n02:typecheck; rc=$?; echo "n02_typecheck_exit=$rc"; ((rc != 0)) && status=1
            echo '=== build ==='; npm run build; rc=$?; echo "build_exit=$rc"; ((rc != 0)) && status=1
            echo '=== selftest ==='; node --experimental-strip-types scripts/n02-resilience-selftest.ts; rc=$?; echo "selftest_exit=$rc"; ((rc != 0)) && status=1
            echo '=== chaos ==='; node --experimental-strip-types scripts/n02-chaos-check.ts; rc=$?; echo "chaos_exit=$rc"; ((rc != 0)) && status=1
            echo "pipeline_exit=$status"
          } 2>&1 | tee n02-forensic-ci.log
          exit "${PIPESTATUS[0]}"
      - name: Upload forensic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n02-forensic-ci-${{ github.run_id }}
          path: n02-forensic-ci.log
          if-no-files-found: warn
