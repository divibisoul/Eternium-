name: N02 Merge Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, frente-3]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: N02 build and type validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: FIRST EXECUTION STEP - capture runner state
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-}"
          echo "RUNNER_OS=${RUNNER_OS:-}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-}"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID:-}"
          node --version
          npm --version
          test -n "${RUNNER_NAME:-}" || { echo "ERROR: GitHub runner was not provisioned."; exit 1; }

      - uses: actions/checkout@v4

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund

      - name: TypeScript validation
        id: lint
        shell: bash
        run: |
          set -euo pipefail
          npm run lint

      - name: Production build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Generate validation report
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          node <<'NODE'
          const fs = require('node:fs');
          const report = {
            generatedAt: new Date().toISOString(),
            workflow: 'N02 Merge Gate',
            commit: process.env.GITHUB_SHA,
            event: process.env.GITHUB_EVENT_NAME,
            steps: {
              install: process.env.INSTALL_OUTCOME || 'not-run',
              lint: process.env.LINT_OUTCOME || 'not-run',
              build: process.env.BUILD_OUTCOME || 'not-run',
            },
          };
          report.status = Object.values(report.steps).every((value) => value === 'success') ? 'PASS' : 'FAIL';
          fs.writeFileSync('.ci/validation-report.json', JSON.stringify(report, null, 2) + '\n');
          if (report.status !== 'PASS') process.exitCode = 1;
          NODE

      - name: Capture GitHub job logs
        if: failure()
        run: node scripts/capture-ci-logs.mjs

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n02-ci-validation
          path: .ci/validation-report.json
          if-no-files-found: error

      - name: Upload captured job logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soul-job-logs-${{ github.run_id }}
          path: soul-job-logs-*.json
          if-no-files-found: ignore
          retention-days: 30

  pending-label:
    name: Mark CI pending until validation succeeds
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      issues: write
      contents: read
    steps:
      - name: Update ci-pending label
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ needs.validate.result }}' === 'success';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const label = 'ci-pending';
            if (success) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            } else {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
            }
