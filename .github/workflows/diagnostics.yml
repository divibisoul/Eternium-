name: N06 validation diagnostics
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_VERSION: '22'
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: FIRST EXECUTION STEP - capture runner state
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/n06-first-step"
          { date -u; uname -a || true; cat /etc/os-release || true; node --version || true; npm --version || true; df -hT || true; free -h || true; env | cut -d= -f1 | sort || true; } 2>&1 | tee "$RUNNER_TEMP/n06-first-step/runner.log"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify toolchain
        run: node --version && npm --version
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Emergency diagnostics
        if: failure()
        run: node scripts/diagnostics.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n06-diagnostics-${{ github.run_id }}
          path: .diagnostics/
          if-no-files-found: ignore
          retention-days: 14
