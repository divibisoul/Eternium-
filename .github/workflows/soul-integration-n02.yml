name: SOUL Integration CI - N02
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate identity
        run: test -s SOUL_ECOSYSTEM.md
      - name: Validate submodule paths
        shell: bash
        run: |
          set -e
          if test -f .gitmodules; then
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | while read p; do test -e "$p"; done
          fi
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validate N02 25-source fabric
        run: npx --yes tsx --test src/soul-mesh/N02ExternalCapabilityFabric.test.ts
      - name: Validate N02 external inference boundaries
        run: npx --yes tsx --test src/soul-mesh/N02ExternalInferenceBridge.test.ts
      - name: Typecheck
        run: npm run lint
