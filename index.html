
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeternum: Entidade Metacognitiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .prose ul { list-style-type: disc; padding-left: 1.5rem; }
      .prose li { margin-top: 0.25rem; margin-bottom: 0.25rem; }
      .font-mono-code { font-family: 'Source Code Pro', monospace; }

      .aeternum-bg {
        background-color: #0A0A0A;
        background-image:
            linear-gradient(rgba(0, 180, 255, 0.07) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 180, 255, 0.07) 1px, transparent 1px);
        background-size: 2rem 2rem;
        background-position: center center;
      }

      .system-degraded {
        filter: blur(1px) brightness(0.8);
        transition: filter 0.5s ease-in-out;
      }

      @keyframes scanline {
        0% { transform: translateY(-10%); }
        100% { transform: translateY(110%); }
      }

      .system-auditing::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: linear-gradient(to bottom, rgba(0, 255, 255, 0), rgba(0, 255, 255, 0.08), rgba(0, 255, 255, 0));
        animation: scanline 4s linear infinite;
        z-index: 9999;
        box-shadow: inset 0 0 150px rgba(0, 150, 200, 0.1);
      }
    </style>
<script type="importmap">
